services:
  - type: web
    name: ipmg-daysheet
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    disk:
      name: daylog-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DAYLOG_PASSWORD
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: DATA_DIR
        value: /var/data/daylog
      - key: DAYLOG_TIMEZONE
        value: America/Los_Angeles
      - key: RETENTION_BACKUPS
        value: "true"
      - key: ALLOWED_IPS
        sync: false
